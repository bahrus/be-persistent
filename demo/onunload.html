<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persist editable content</title>
    <!-- #include virtual="/imports.html" -->
    <be-hive>
        <script type=emc-parser
                src="be-hive/parsers/parse-grouped-capture-statements.js"
                parser-name=parse-grouped-capture-statements></script>
        <script type=emc
                src="be-persistent/emc.json"
                wait-for-parsers=parse-grouped-capture-statements></script>
    </be-hive>
    <script type=module>
        import 'be-hive/be-hive.js';
    </script>
</head>
<body>
    <div contenteditable=true be-persistent="of innerHTML via sessionStorage://{autoGenId}.">hello</div>
</body>
</html>
