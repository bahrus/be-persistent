<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nudge (be-persistent-nudge)</title>
    <!-- #include virtual="/imports.html" -->
    <be-hive>
        <script type=emc-parser
                src="be-hive/parsers/parse-grouped-capture-statements.js"
                parser-name=parse-grouped-capture-statements></script>
        <script type=emc
                src="be-persistent/emc.json"
                wait-for-parsers=parse-grouped-capture-statements></script>
    </be-hive>
    <script type=module>
        import 'be-hive/be-hive.js';
    </script>
</head>
<body>
    <!-- opt-in: re-enabled once its value is rehydrated -->
    <input id=subject disabled be-persistent="via sessionStorage://{autoGenId}." be-persistent-nudge value="hello">
    <!-- no opt-in: stays disabled -->
    <input id=control disabled be-persistent="via sessionStorage://{autoGenId}." value="world">
</body>
</html>
